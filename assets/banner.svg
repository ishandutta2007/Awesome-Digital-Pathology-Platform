nkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" letter-spacing=".2">Curated Whole-Slide Imaging (WSI), AI Diagnostics, SaaS Platforms &amp; Open-Source Workstations</text><g transform="translate(0, 130)"><rect width="110" height="26" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="13"/><text x="55" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">QuPath &amp; MONAI</text><rect width="110" height="26" x="120" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="13"/><text x="175" y="17" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">OpenSlide I/O</text><rect width="120" height="26" x="240" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="13"/><text x="300" y="17" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Enterprise SaaS</text><rect width="120" height="26" x="370" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="13"/><text x="430" y="17" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">WSI AI Diagnostics</text></g></g></svg>