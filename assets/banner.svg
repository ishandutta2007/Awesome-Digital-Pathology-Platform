<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07182e"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6b11ff"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Scanning Line -->
    <style>
      .scan-line {
        animation: scan 4s ease-in-out infinite alternate;
      }
      .pulse-node {
        animation: pulse 2.5s ease-in-out infinite alternate;
      }
      .float-cell {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { transform: translateY(280px); opacity: 0.3; }
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.5; }
        100% { transform: scale(1.03); opacity: 0.9; }
      }
      @keyframes float {
        0% { transform: translate(0, 0); }
        100% { transform: translate(15px, -15px); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle Digital Pathology Grid (Background elements strictly placed away from text) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350"/>
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400"/>
  </g>

  <!-- Dynamic WSI Scanning Overlay Box (Right side decorative element, doesn't obscure text) -->
  <g transform="translate(850, 70)" class="pulse-node">
    <!-- Whole-Slide Reticle Box -->
    <rect x="0" y="0" width="260" height="260" rx="16" fill="#091a2f" fill-opacity="0.6" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4" filter="url(#subtleGlow)"/>
    <!-- Mock Histology Tissue Heatmap -->
    <circle cx="90" cy="110" r="55" fill="#e11d48" fill-opacity="0.35" filter="url(#glow)"/>
    <circle cx="150" cy="140" r="65" fill="#8b5cf6" fill-opacity="0.3" filter="url(#glow)"/>
    <circle cx="170" cy="90" r="40" fill="#00f2fe" fill-opacity="0.25"/>
    <path d="M 50,60 Q 120,40 190,90 T 210,200" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- Animated Scan Line -->
    <line x1="5" y1="10" x2="255" y2="10" stroke="#00f2fe" stroke-width="3" filter="url(#glow)" class="scan-line"/>

    <!-- Reticle Corners -->
    <path d="M 0,30 L 0,0 L 30,0 M 230,0 L 260,0 L 260,30 M 260,230 L 260,260 L 230,260 M 30,260 L 0,260 L 0,230" stroke="#00f2fe" stroke-width="3" fill="none"/>
    <text x="130" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">AI WSI ANALYSIS PLATFORM</text>
  </g>

  <!-- Background Decorative Floating Micro-Cells (Left side) -->
  <g class="float-cell" opacity="0.25">
    <circle cx="90" cy="80" r="18" fill="#38bdf8"/>
    <circle cx="130" cy="320" r="24" fill="#8b5cf6"/>
    <circle cx="60" cy="260" r="12" fill="#ec4899"/>
  </g>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)"/>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Always visible & clearly crisp) -->
  <!-- Main Title -->
  <g transform="translate(80, 150)">
    <!-- Badge -->
    <rect x="0" y="-85" width="280" height="32" rx="16" fill="url(#accentGrad)" opacity="0.2"/>
    <rect x="0" y="-85" width="280" height="32" rx="16" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.5"/>
    <text x="140" y="-64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="2">🔬 DIGITAL PATHOLOGY ECOSYSTEM</text>

    <!-- Main Title Text -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Digital Pathology
    </text>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Platforms &amp; Open-Source AI
    </text>

    <!-- Subtitle -->
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Whole-Slide Imaging (WSI), AI Diagnostics, SaaS Platforms &amp; Open-Source Workstations
    </text>

    <!-- Tech Pills -->
    <g transform="translate(0, 130)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="110" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="55" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">QuPath &amp; MONAI</text>

      <!-- Pill 2 -->
      <rect x="120" y="0" width="110" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="175" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a855f7" text-anchor="middle">OpenSlide I/O</text>

      <!-- Pill 3 -->
      <rect x="240" y="0" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="300" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f43f5e" text-anchor="middle">Enterprise SaaS</text>

      <!-- Pill 4 -->
      <rect x="370" y="0" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="430" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle">WSI AI Diagnostics</text>
    </g>
  </g>
</svg>
