<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#07182e"/><stop offset="100%" stop-color="#0d1b2a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#6b11ff"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes scan{0%{transform:translateY(0);opacity:.3}50%{opacity:.8}}@keyframes pulse{0%{transform:scale(.98);opacity:.5}}@keyframes float{0%{transform:translate(0,0)}}.scan-line{animation:scan 4s ease-in-out infinite alternate}.pulse-node{animation:pulse 2.5s ease-in-out infinite alternate}.float-cell{animation:float 6s ease-in-out infinite alternate}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)"/><g stroke="#fff" stroke-opacity=".04" stroke-width="1"><path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350"/><path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400"/></g><g class="pulse-node" transform="translate(850, 70)"><rect width="260" height="260" x="0" y="0" fill="#091a2f" fill-opacity=".6" stroke="#00f2fe" stroke-opacity=".4" stroke-width="2" filter="url(#subtleGlow)" rx="16"/><circle cx="90" cy="110" r="55" fill="#e11d48" fill-opacity=".35"